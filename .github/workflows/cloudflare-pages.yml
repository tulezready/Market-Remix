# Publishes the website to Cloudflare Pages on every push to main.
#
# Builds dist/ with scripts/build-site.sh (website files only — never docs/ or db/)
# and uploads it with Wrangler. Used instead of Cloudflare's own GitHub link.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with  Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
# Until both are set, the workflow skips the upload and passes.
# Optional repository variable CF_PAGES_PROJECT changes the project name (default: maketples).

name: Publish to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'maketples' }}
    steps:
      - name: Check the Cloudflare keys are set
        id: keys
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare keys not added yet — skipping. See the comment at the top of this file."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'

      - name: Build the website
        if: steps.keys.outputs.ready == 'true'
        run: sh scripts/build-site.sh

      - name: Create the Pages project (first run only)
        if: steps.keys.outputs.ready == 'true'
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main

      - name: Upload to Cloudflare
        if: steps.keys.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s)" --commit-dirty=true
