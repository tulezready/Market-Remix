# Keeps the free Supabase project awake.
#
# Free Supabase projects pause after about a week with no database activity.
# This runs a small read-only query twice a week so the project stays up while
# we build. Delete this file once the project is on the Pro plan.
#
# It uses the same public (publishable) key as the website, read from config.js,
# and reads only the public business directory. Never put the secret or
# service-role key here.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4"   # Mondays and Thursdays, 03:17 UTC (13:17 in PNG)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false

      - name: Query the database
        run: |
          url=$(sed -nE 's/.*supabaseUrl: *"([^"]*)".*/\1/p' config.js)
          key=$(sed -nE 's/.*supabaseKey: *"([^"]*)".*/\1/p' config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "config.js has no Supabase project set; nothing to keep awake."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 \
              -H "apikey: $key" \
              "$url/rest/v1/public_smes?select=id&limit=1" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Supabase answered (HTTP 200): $(cat body.json)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"; cat body.json 2>/dev/null; echo
            sleep $((attempt * 20))
          done
          echo "::error::Supabase did not answer. If the project is paused, restore it from the Supabase dashboard."
          exit 1
